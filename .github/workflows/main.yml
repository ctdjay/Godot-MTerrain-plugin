name: Build GDExtension
on: [workflow_dispatch, push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: recursive
          path: addons

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y scons mingw-w64

      - name: Build Godot C++ Bindings
        run: |
          cd addons/gdextension/godot-cpp
          scons platform=windows target=template_debug use_mingw=yes

      - name: Compile MTerrain Plugin
        run: |
          cd addons/gdextension
          scons platform=windows target=template_debug use_mingw=yes

      - name: Upload Finished Addon Artifact
        uses: actions/upload-artifact@v4
        with:
          name: mterrain-godot4.8-windows
          path: addons/
