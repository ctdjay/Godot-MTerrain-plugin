name: Build M-Terrain GDExtension

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.x'

    - name: Install SCons
      run: python -m pip install scons

    - name: Configure Directory Layout and Build
      run: |
        # 1. Clear out any previous partial builds
        rm -rf m_terrain_temp m_terrain
        
        # 2. Re-structure repository directories into the expected layout
        mkdir -p m_terrain_temp/m_terrain
        
        # 3. Move everything from the root into the correct parent folder structure
        find . -maxdepth 1 ! -name '.' ! -name 'm_terrain_temp' -exec mv {} m_terrain_temp/m_terrain/ \;
        mv m_terrain_temp/m_terrain .
        rm -rf m_terrain_temp

        # 4. Navigate into the corrected gdextension folder paths and execute build
        cd m_terrain/gdextension
        scons platform=windows arch=x86_64 target=template_release
