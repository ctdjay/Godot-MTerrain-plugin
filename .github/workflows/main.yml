name: Build M-Terrain GDExtension

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-python-version: '3.x'

    - name: Install SCons
      run: python -m pip install scons

    - name: Fix Directory Structure and Build
      run: |
        # Rename 'addons' to 'm_terrain' to satisfy the SConstruct check
        mv addons m_terrain
        
        # Navigate to the new path and compile
        cd m_terrain/gdextension
        scons target=template_release
